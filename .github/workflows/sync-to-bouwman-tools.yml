name: Sync naar bouwman-tools

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node opzetten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tests draaien
        # Poort vóór publicatie: faalt een test, dan wordt er niets gekopieerd en
        # blijft de vorige versie op bouwman.tools staan.
        run: npm test

      - name: Kopieer naar bouwman-tools
        env:
          GH_TOKEN: ${{ secrets.BOUWMAN_TOOLS_PAT }}
        run: |
          gh auth setup-git
          GITHUB_SHA_KORT=$(git rev-parse --short "$GITHUB_SHA")
          git clone https://github.com/bouwman-tools/bouwman-tools.git _bouwman
          cp bewaarplicht.html _bouwman/bewaarplicht.html
          cd _bouwman
          git config user.email "s.bouwman@joinadministraties.nl"
          git config user.name "Sylvainbouwman"
          git add bewaarplicht.html
          git diff --staged --quiet || git commit -m "Sync vanuit bewaarplicht-checker ($GITHUB_SHA_KORT)"
          git pull origin master --rebase
          git push
